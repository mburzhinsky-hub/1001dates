name: Deploy 1001 Dates

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh Moscow places and events
        id: refresh
        continue-on-error: true
        env:
          KUDAGO_PLACE_PAGES: 20
          KUDAGO_EVENT_PAGES: 8
          KUDAGO_PER_CATEGORY: 280
          KUDAGO_PER_SUBTYPE: 90
        run: node scripts/update-kudago.mjs

      - name: Validate data
        shell: bash
        run: |
          if [ "${{ steps.refresh.outcome }}" = "success" ]; then
            node scripts/validate-data.mjs --strict
          else
            echo "Live data refresh failed; deploying curated fallback data."
            node scripts/validate-data.mjs
          fi

      - name: Test planner engine
        run: |
          node scripts/audit-scenarios.mjs
          node scripts/smoke-test.mjs
          node scripts/audit-filters.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
