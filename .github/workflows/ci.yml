name: Production CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app-final.js
      - run: node scripts/ui-contract-test.mjs
      - run: node scripts/preparation-test.mjs
      - run: node scripts/scenario-audit-fixes-test.mjs
      - run: node scripts/scenario-map-test.mjs
      - run: node scripts/nearby-planner-test.mjs
      - run: node scripts/scenario-visuals-test.mjs
      - run: node scripts/validate-data.mjs --strict
      - run: node scripts/audit-scenarios.mjs
      - run: node scripts/smoke-test.mjs
      - run: node scripts/audit-filters.mjs
      - run: node scripts/audit-production-scenarios.mjs
      - run: node scripts/production-integration-test.mjs
