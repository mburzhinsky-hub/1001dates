name: Build v14 Logic

on:
  push:
    branches: [logic-v14]
    paths: ['.github/workflows/v14-build.yml']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: logic-v14
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v14 payload
        shell: bash
        run: |
          cat > /tmp/v14.b64 <<'PAYLOAD'
[... ELLIPSIZATION ...]
PAYLOAD
          base64 -d /tmp/v14.b64 > /tmp/v14.tgz
          tar -xzf /tmp/v14.tgz
      - name: Rebuild Moscow database
        env:
          KUDAGO_PLACE_PAGES: 20
          KUDAGO_EVENT_PAGES: 8
          KUDAGO_FOCUS_PAGES: 3
          KUDAGO_PER_CATEGORY: 280
          KUDAGO_PER_SUBTYPE: 90
          KUDAGO_RADIUS_METERS: 30000
        run: node scripts/update-kudago.mjs
      - name: Validate v14
        run: |
          node --check app.js
          node --check engine.js
          node --check data/runtime-db.js
          node --check scripts/update-kudago.mjs
          node scripts/validate-data.mjs --strict
          node scripts/audit-scenarios.mjs
          node scripts/audit-production.mjs
          node scripts/audit-repetition.mjs
      - name: Commit rebuilt v14
        run: |
          git config user.name "1001-dates-builder"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js engine.js index.html sw.js README.md data/runtime-db.js data/kudago.generated.js scripts/update-kudago.mjs scripts/validate-data.mjs scripts/smoke-test.mjs scripts/audit-production.mjs scripts/audit-repetition.mjs
          git commit -m "release: v14 logic and repetition fix" || exit 0
          git push origin HEAD:logic-v14
