name: Android cloud build

on:
  push:
    branches:
      - android-capacitor
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-capacitor-build
  cancel-in-progress: false

jobs:
  build-android:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Capacitor dependencies
        run: npm ci

      - name: Generate or sync Android project
        shell: bash
        run: |
          if [ -d android ]; then
            npm run android:sync
          else
            npm run android:init
          fi

      - name: Build debug APK and release bundle
        shell: bash
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: 1001-dates-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: 1001-dates-release-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14

      - name: Record workflow run id
        shell: bash
        run: |
          mkdir -p release-output
          printf '%s\n' "$GITHUB_RUN_ID" > release-output/run-id.txt

      - name: Commit generated Android metadata
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- android package-lock.json release-output/run-id.txt
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "build: record Android release run [skip ci]"
            git push origin HEAD:android-capacitor
          fi
